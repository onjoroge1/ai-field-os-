name: Field OS

on:
  pull_request:
    paths:
      - "erpnext/field_os/**"
      - ".github/workflows/field-os.yml"
  push:
    branches: [develop]
    paths:
      - "erpnext/field_os/**"

permissions:
  contents: read

jobs:
  field-os-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Compile Field OS Python
        run: python -m compileall -q erpnext/field_os
      - name: Run isolated Field OS regression tests
        run: python erpnext/field_os/tests/run_unit.py

  equipment-live:
    name: Equipment acceptance (MariaDB)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: fieldos-test-root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.2
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install runtime prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libmariadb-dev mariadb-client pkg-config
          pip install frappe-bench
          npm install -g yarn@1.22.22
      - name: Create disposable Frappe and ERPNext site
        run: |
          bench init "$RUNNER_TEMP/fieldos-bench" --frappe-branch develop --skip-assets --skip-redis-config-generation --python python3.14
          cd "$RUNNER_TEMP/fieldos-bench"
          bench get-app --skip-assets erpnext "$GITHUB_WORKSPACE"
          bench set-config -g redis_cache redis://127.0.0.1:6379/0
          bench set-config -g redis_queue redis://127.0.0.1:6379/1
          bench set-config -g redis_socketio redis://127.0.0.1:6379/2
          bench new-site fieldos.test --db-type mariadb --db-host 127.0.0.1 --mariadb-user-host-login-scope '%' --db-root-password fieldos-test-root --admin-password fieldos-test-admin
          bench --site fieldos.test install-app erpnext
          bench --site fieldos.test set-config allow_tests true
      - name: Verify real equipment persistence and tenant permissions
        run: |
          cd "$RUNNER_TEMP/fieldos-bench"
          bench --site fieldos.test execute erpnext.field_os.tests.integration.test_equipment_live.run
      - name: Build operator assets and install browser
        run: |
          cd "$RUNNER_TEMP/fieldos-bench"
          bench build --apps frappe,erpnext
          npm install -g agent-browser@0.38.1
          agent-browser install
      - name: Verify real estimates, parts and customer approvals
        run: |
          cd "$RUNNER_TEMP/fieldos-bench"
          bench --site fieldos.test execute erpnext.field_os.tests.integration.test_estimates_live.run
      - name: Verify manager and technician browser workflows
        env:
          FIELD_OS_TEST_PASSWORD: fieldos-browser-acceptance
        run: |
          cd "$RUNNER_TEMP/fieldos-bench"
          bench --site fieldos.test execute erpnext.field_os.tests.integration.test_equipment_live.seed_browser
          env/bin/python apps/erpnext/erpnext/field_os/tests/integration/test_equipment_browser.py
      - name: Verify estimate delivery and customer approval in browser
        env:
          FIELD_OS_TEST_PASSWORD: fieldos-browser-acceptance
        run: |
          cd "$RUNNER_TEMP/fieldos-bench"
          bench --site fieldos.test execute erpnext.field_os.tests.integration.test_estimates_live.prepare_estimates
          env/bin/python apps/erpnext/erpnext/field_os/tests/integration/test_estimates_browser.py
      - name: Preserve estimate browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estimates-browser
          path: ${{ runner.temp }}/fieldos-bench/logs/estimates-*.png
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equipment-browser
          path: ${{ runner.temp }}/fieldos-bench/logs/equipment-*.png
      - name: Preserve failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: equipment-site-logs
          path: ${{ runner.temp }}/fieldos-bench/logs/
